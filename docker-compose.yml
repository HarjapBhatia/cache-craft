services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cachecraft
      POSTGRES_USER: cachecraft
      POSTGRES_PASSWORD: cachecraft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cachecraft -d cachecraft"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  api-1: &api
    build: .
    environment:
      CACHECRAFT_INSTANCE_NAME: api-1
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cachecraft
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8081:8080"]

  api-2:
    <<: *api
    environment:
      CACHECRAFT_INSTANCE_NAME: api-2
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cachecraft
      SPRING_DATA_REDIS_HOST: redis
    ports: ["8082:8080"]

  api-3:
    <<: *api
    environment:
      CACHECRAFT_INSTANCE_NAME: api-3
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cachecraft
      SPRING_DATA_REDIS_HOST: redis
    ports: ["8083:8080"]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api-1, api-2, api-3]
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  redis-data:
